name: macOS Release

on:
  push:
    branches:
      - main
    paths-ignore:
      - appcast.xml

concurrency:
  group: release-main
  cancel-in-progress: true

jobs:
  release:
    runs-on: macos-latest
    permissions:
      contents: write
    env:
      APP_NAME: Clipboard Manager
      DMG_NAME: Clipboard.Manager.dmg
      SPARKLE_VERSION: 2.8.0

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compute next version
        id: version
        run: |
          git fetch --tags --force
          LATEST_TAG=$(git tag -l 'v[0-9]*' --sort=-v:refname | head -n1)
          if [ -z "$LATEST_TAG" ]; then LATEST_TAG="v0.0.0"; fi
          BASE_VERSION=${LATEST_TAG#v}
          IFS='.' read -r MAJOR MINOR PATCH <<< "$BASE_VERSION"
          PATCH=$((PATCH+1))
          SHORT_VERSION="$MAJOR.$MINOR.$PATCH"
          TAG="v$SHORT_VERSION"
          while git rev-parse -q --verify "refs/tags/$TAG" >/dev/null || git ls-remote --tags origin "$TAG" | grep -q .; do
            PATCH=$((PATCH+1))
            SHORT_VERSION="$MAJOR.$MINOR.$PATCH"
            TAG="v$SHORT_VERSION"
          done
          BUILD_NUMBER="$GITHUB_RUN_NUMBER"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "short_version=$SHORT_VERSION" >> "$GITHUB_OUTPUT"
          echo "build_number=$BUILD_NUMBER" >> "$GITHUB_OUTPUT"

      - name: Update Xcode version
        run: |
          SHORT_VERSION="${{ steps.version.outputs.short_version }}"
          BUILD_NUMBER="${{ steps.version.outputs.build_number }}"
          PBXPROJ="Clipboard Manager.xcodeproj/project.pbxproj"
          perl -pi -e "s/MARKETING_VERSION = [^;]+;/MARKETING_VERSION = $SHORT_VERSION;/g" "$PBXPROJ"
          perl -pi -e "s/CURRENT_PROJECT_VERSION = [^;]+;/CURRENT_PROJECT_VERSION = $BUILD_NUMBER;/g" "$PBXPROJ"

      - name: Tag release
        run: |
          git tag "${{ steps.version.outputs.tag }}"
          git push origin "${{ steps.version.outputs.tag }}"

      - name: Build macOS app
        run: |
          xcodebuild -project "Clipboard Manager.xcodeproj" \
                     -scheme "Clipboard Manager" \
                     -configuration Release \
                     -derivedDataPath build \
                     clean build

      - name: Prepare app for DMG
        run: |
          mkdir -p build/Release
          cp -R build/Build/Products/Release/*.app build/Release/

      - name: Install create-dmg
        run: brew install create-dmg

      - name: Build DMG
        run: ./scripts/build_dmg.sh

      - name: Install Sparkle tools
        run: |
          curl -L -o "$RUNNER_TEMP/Sparkle.tar.xz" \
            "https://github.com/sparkle-project/Sparkle/releases/download/${SPARKLE_VERSION}/Sparkle-${SPARKLE_VERSION}.tar.xz"
          tar -xJf "$RUNNER_TEMP/Sparkle.tar.xz" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/Sparkle-${SPARKLE_VERSION}/Tools/bin" >> "$GITHUB_PATH"
          ls "$RUNNER_TEMP/Sparkle-${SPARKLE_VERSION}/Tools/bin"

      - name: Sign DMG
        id: sign
        env:
          SPARKLE_EDDSA_PRIVATE_KEY: ${{ secrets.SPARKLE_EDDSA_PRIVATE_KEY }}
        run: |
          DMG_PATH="build/dmg/$DMG_NAME"
          KEY_FILE="$RUNNER_TEMP/sparkle_ed25519.key"
          printf "%s" "$SPARKLE_EDDSA_PRIVATE_KEY" > "$KEY_FILE"
          SIGNATURE_LINE=$(sign_update --ed-key-file "$KEY_FILE" "$DMG_PATH")
          SIGNATURE=$(echo "$SIGNATURE_LINE" | sed -E 's/.*sparkle:edSignature="([^"]+)".*/\1/')
          echo "signature=$SIGNATURE" >> "$GITHUB_OUTPUT"

      - name: Generate appcast.xml
        run: |
          DMG_PATH="build/dmg/$DMG_NAME"
          DMG_URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/${{ steps.version.outputs.tag }}/$DMG_NAME"
          scripts/generate_appcast.sh "$DMG_PATH" "$DMG_URL" "${{ steps.version.outputs.short_version }}" "${{ steps.version.outputs.build_number }}" "${{ steps.sign.outputs.signature }}"

      - name: Upload to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          DMG_PATH="build/dmg/$DMG_NAME"
          TAG="${{ steps.version.outputs.tag }}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$DMG_PATH" appcast.xml --clobber
          else
            gh release create "$TAG" "$DMG_PATH" appcast.xml --title "Release ${{ steps.version.outputs.short_version }}" --generate-notes
          fi